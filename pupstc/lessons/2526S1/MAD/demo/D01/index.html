<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap demo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

  <style>
    .nav {
      width: 50px;
      height: 50px;
      background-color: white;
      transition: 200ms;
    }

    .nav:hover {
      width: 50%;
    }

    .nav-items {
      display: none;
      transition: 200ms;
    }

    body {
      background-color: lightgray;
    }

    .bg {
      width: 100%;
      height: 100vh;
      background-color: purple;
      z-index: -1;
    }

    .glass {
      background-color: rgba(255,255,255,0.3);
      backdrop-filter: blur(20px);
      color: white;
    }

    @keyframes moveCircle {
      0% {
        bottom: -250px;
        left: -100px;
      }

      50% {
        bottom: 500px;
        left: 100px;
      }

      100% {
        bottom: -250px;
        left: -100px;
      }
    }

    .circle {
      width: 500px;
      height: 500px;
      background-color: magenta;
      position: absolute;
      bottom: -250px;
      left: -100px;

      animation-name: moveCircle;
      animation-duration: 10s;
      animation-iteration-count: infinite;
    }
  </style>
</head>

<body>
  <div class="position-fixed top-0 bg">
    <div class="circle rounded-circle"></div>
  </div>

  <div class="container-fluid z-1">
    <div class="row">
      <div class="col px-3">
        <div class="shadow rounded-5 my-4 p-3 nav glass" onmouseenter="showitems()" onmouseleave="hideitems()">
          <div class="w-100 d-flex justify-content-around">
            <div class="nav-items">Home</div>
            <div class="nav-items">About</div>
            <div class="nav-items">Contact</div>
          </div>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col">
        <div class="card rounded-5 p-5 glass text-center">
          <div class="h3">Title</div>
          <div>Lorem ipsum dolor sit amet consectetur adipisicing elit. Debitis, nostrum ullam! Deserunt necessitatibus beatae ipsa reprehenderit corrupti recusandae itaque earum illum nobis, blanditiis nostrum aut dolorum esse quos odit ipsam!</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function showitems() {
      var items = document.getElementsByClassName('nav-items');

      for (var i = 0; i < items.length; i++) {
        items[i].style.display = "block";
      }
    }

    function hideitems() {
      var items = document.getElementsByClassName('nav-items');

      for (var i = 0; i < items.length; i++) {
        items[i].style.display = "none";
      }
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
