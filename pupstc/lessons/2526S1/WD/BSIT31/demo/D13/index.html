<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap demo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
  <div class="container">
    <div class="row">
      <div class="col">
        <div class="card rounded-3 my-4 p-4 shadow-sm">
          <div class="h3 mb-3">Create Post</div>

          <div class="my-3">
            <label for="title" class="form-label">Title</label>
            <input id="title" type="text" class="form-control"></input>
          </div>
          <div class="my-3">
            <label for="content" class="form-label">Content</label>
            <input id="content" type="text" class="form-control"></input>
          </div>
          <div class="text-end mt-5">
            <div class="btn btn-success px-3 rounded-5" onclick="getData()">Post</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="container my-4">
    <div class="row my-3">
      <div class="col">
        <div class="display-3">
          POSTS
        </div>
      </div>
    </div>
    <div class="row" id="contentArea">
      
    </div>
  </div>

  <script>
    var titles = [];
    var contents = [];

    function renderPosts() {
      var contentArea = document.getElementById('contentArea');
      contentArea.innerHTML = "";

      for(var i = 0; i<titles.length; i++){
        contentArea.innerHTML += `
          <div class="col-12">
            <div class="card rounded-3 p-3 my-3">
              <div class="h4 mb-3">`+titles[i]+`</div>
              <div>
                `+contents[i]+`
              </div>
            </div>
          </div>
        `;
      }
    }

    function getData() {
      var title = document.getElementById("title").value;
      var content = document.getElementById("content").value;

      titles.unshift(title);
      contents.unshift(content);

      renderPosts();
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
