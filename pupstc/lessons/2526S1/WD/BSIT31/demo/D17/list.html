<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap demo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
  <div class="container-fluid" style="background-color: brown;">
    <div class="row p-3">
      <div class="col">
        <div class="h3 text-light">
          PokéDex
        </div>
      </div>
      <div class="col text-end">
        <a href="index.html">
          <button class="btn btn-secondary">Back</button>
        </a>
      </div>
    </div>
  </div>

  <div class="container my-3">
    <div class="row">
      <div class="col">
        <nav aria-label="Page navigation example">
          <ul class="pagination">
            <li class="page-item">
              <a class="page-link" aria-label="Previous" onclick="prevPage()">
                <span aria-hidden="true">&laquo;</span>
              </a>
            </li>
            <li class="page-item">
              <a class="page-link" aria-label="Next" onclick="nextPage()">
                <span aria-hidden="true">&raquo;</span>
              </a>
            </li>
          </ul>
        </nav>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="row">
      <div class="col">
        <div id="pageText">
          Page 1
        </div>
      </div>
    </div>
  </div>

  <div class="container my-1">
    <div class="row" id="contentArea">
    </div>
  </div>

  <script>
    const colors = {
      fire: '#FDDFDF',
      grass: '#DEFDE0',
      electric: '#FCF7DE',
      water: '#DEF3FD',
      ground: '#f4e7da',
      rock: '#d5d5d4',
      fairy: '#fceaff',
      poison: '#cbc3e3',
      bug: '#f8d5a3',
      dragon: '#97b3e6',
      psychic: '#eaeda1',
      flying: '#F5F5F5',
      fighting: '#E6E0D4',
      normal: '#F5F5F5'
    };

    var contentArea = document.getElementById("contentArea");
    var pageText = document.getElementById("pageText");
    var name, type, id, picture;

    var page = 1;

    function prevPage(){
      page--;
      pageText.innerHTML = "Page " + page;
      contentArea.innerHTML = "";
      getPokemon();
    }

    function nextPage(){
      page++;
      pageText.innerHTML = "Page " + page;
      contentArea.innerHTML = "";
      getPokemon();
    }

    const getPokemon = async () => {
      for (var i = (10 * page) - 9; i <= page * 10; i++) {
        const response = await fetch('https://pokeapi.co/api/v2/pokemon/' + i);
        const pokemonData = await response.json();

        name = pokemonData.name;
        type = pokemonData.types[0].type.name;
        id = pokemonData.id;
        picture = pokemonData.sprites.other.home.front_default;

        contentArea.innerHTML += `
        <div class="col-12 col-md-6 col-lg-4">
          <div class="card p-5 rounded-5 my-4 text-center">
            <div style="width: 200px; height: 200px; background-color: `+ colors[type] + `" class="rounded-circle mx-auto">
              <img class="w-100" src="`+ picture + `">
            </div>
            <div class="h3 my-3">
              #`+ id + ` ` + name + `
            </div>
            <div class="mt-3 px-5">
              <div class="border rounded-5 p-2" style="background-color: `+ colors[type] + `">
                `+ type + `
              </div>
            </div>
          </div>
        </div>
        `;
      }
    }

    getPokemon();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
