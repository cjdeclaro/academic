<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap demo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
  <div class="container">
    <div class="row">
      <div class="col">
        <div class="h1 text-center p-5">
          Welcome!
        </div>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="row">
      <div class="col">
        <div class="display-4">
          Gallery
        </div>
      </div>
    </div>
    <div class="row" id="content">
    </div>
  </div>

  <script>
    var content = document.getElementById("content");
    var people = ["John", "Joe", "Jane", "Bill", "Steve", "Ada", "Charles"];
    var description = ["Lorem", "Ipsum", "Dolor", "Sit", "Amet", "consectetur", "adipisicing"];
    var picture = ["dp.png", "mypic.png", "", "profilepic.png", "", "", "pic.png"]

    for (var i = 0; i < people.length; i++) {
      content.innerHTML += `
        <div class="col-6 col-md-4 col-lg-3">
          <div class="card shadow my-3">
            <img src="`+picture[i]+`" class="card-img-top">
            <div class="card-body">
              <h5 class="card-title">` + people[i] + `</h5>
              <p class="card-text">
                ` + description[i] + `
              </p>
            </div>
          </div>
        </div>
      `;
    }
  </script>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
