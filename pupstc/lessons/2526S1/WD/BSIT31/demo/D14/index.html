<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap demo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
  <div class="container">
    <div class="row">
      <div class="col" id="contentArea">
        
      </div>
    </div>
  </div>

  <script>
    var contentArea = document.getElementById("contentArea");
    var name, type, id, picture;

    const getPokemon = async () => {
      const response = await fetch('https://pokeapi.co/api/v2/pokemon/snorlax');
      const pokemonData = await response.json();

      name = pokemonData.name;
      type = pokemonData.types[0].type.name;
      id = pokemonData.id;
      picture = pokemonData.sprites.other.home.front_default;

      contentArea.innerHTML = `
        <div class="card p-5 rounded-5 my-4 text-center">
          <div style="width: 200px; height: 200px" class="bg-secondary rounded-circle mx-auto">
            <img class="w-100" src="`+picture+`">
          </div>
          <div class="h3 my-3">
            #`+id+` `+name+`
          </div>
          <div class="mt-3 px-5">
            <div class="border rounded-5 p-2">
              `+type+`
            </div>
          </div>
        </div>
      `;
    }

    getPokemon();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
