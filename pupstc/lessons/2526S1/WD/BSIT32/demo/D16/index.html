<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap demo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
  <div class="container mb-4">
    <div class="row">
      <div class="col">
        <div class="display-3">
          PokéDex
        </div>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="row" id="contents">
      
    </div>
  </div>

  <script>
    var contents = document.getElementById("contents");

    const getPokemon = async () => {
      const response = await fetch('https://pokeapi.co/api/v2/pokemon/snorlax');
      const pikachu = await response.json();

      contents.innerHTML = `
        <div class="col">
          <div class="card shadow p-5 rounded-5 text-center">
            <div class="mx-auto rounded-circle" style="width: 200px; height: 200px; background-color: grey;">
              <img src="`+pikachu.sprites.other.home.front_default+`" class="w-100">
            </div>
            <div class="my-3 h4">
              #`+pikachu.id+` `+pikachu.name+`
            </div>
          </div>
        </div>
      `;
    }



    getPokemon();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
