<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap demo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
  <div class="container my-4">
    <div class="row">
      <div class="col">
        <div class="card rounded-3 shadow p-5">
          <div class="h4">Create a post</div>
          <div class="my-3">
            <label for="title" class="form-label">Title</label>
            <input type="text" id="title" class="form-control">
          </div>
          <div class="my-3">
            <label for="title" class="form-label">Content</label>
            <input type="text" id="content" class="form-control">
          </div>
          <div class="mt-3 text-end">
            <button onclick="createPost()" class="btn btn-lg btn-success">Post</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="container my-4">
    <div class="row">
      <div class="col">
        <div class="h1 text-center p-5">
          Posts
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col" id="postContainer">
        
      </div>
    </div>
  </div>

  <script>
    var postTitles = [];
    var postContents = [];

    function renderContents(){
      var postContainer = document.getElementById("postContainer");
      postContainer.innerHTML = "";

      for(var i = 0; i<postTitles.length; i++){
        postContainer.innerHTML += `
          <div class="card p-4 my-3">
            <div class="h5">`+postTitles[i]+`</div>
            <div class="my-2">`+postContents[i]+`</div>
          </div>
        `;
      }
    }

    function createPost(){
      var inputTitle = document.getElementById("title").value;
      var inputContent = document.getElementById("content").value;

      postTitles.unshift(inputTitle);
      postContents.unshift(inputContent);

      renderContents();
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
