<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap demo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
  <div class="container">
    <div class="row">
      <div class="col">
        <div class="h1 text-center my-3" id="welcomeMessage">
          Welcome!
        </div>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="row">
      <div class="col">
        <div class="card my-5 rounded-5 p-5">
          <div class="my-3">
            <label for="fname" class="form-label">First Name</label>
            <input id="fname" type="text" class="form-control">
          </div>

          <div class="my-3">
            <label for="lname" class="form-label">Last Name</label>
            <input id="lname" type="text" class="form-control">
          </div>
          
          <div class="my-3 text-end">
            <button class="btn btn-success" onclick="login()">Log In</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function getFullName(firstName, lastName){
      return firstName + " " + lastName;
    }

    function sayHello(firstName, lastName){
      return "Hello " + getFullName(firstName, lastName) + "!";
    }

    function login() {
      var fname = document.getElementById("fname").value;
      var lname = document.getElementById("lname").value;

      if(!lname) {
        console.log("No last name");
      }

      var welcomeMessage = document.getElementById("welcomeMessage");
      welcomeMessage.innerHTML = sayHello(fname, lname);
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
