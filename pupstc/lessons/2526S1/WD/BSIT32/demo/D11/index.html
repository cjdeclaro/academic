<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap demo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
  <div class="container">
    <div class="row">
      <div class="col">
        <div class="card my-5 rounded-5 p-5">
          <div class="row">
            <div class="col-6">
              <div class="my-3">
                <label for="number1" class="form-label">Number 1</label>
                <input id="number1" type="number" class="form-control">
              </div>
            </div>

            <div class="col-6">
              <div class="my-3">
                <label for="number2" class="form-label">Number 2</label>
                <input id="number2" type="number" class="form-control">
              </div>
            </div>
          </div>

          <div class="my-3">
            <label for="answer" class="form-label">Answer</label>
            <input id="answer" type="number" class="form-control" readonly>
          </div>
          
          <div class="my-3 text-end">
            <button class="btn btn-outline-secondary" onclick="calculate()">Calculate</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function calculate() {
      var number1 = document.getElementById("number1");
      var val1 = parseInt(number1.value);

      var number2 = document.getElementById("number2");
      var val2 = parseInt(number2.value);

      var answerField = document.getElementById("answer");
      answerField.value = val1 + val2;
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
