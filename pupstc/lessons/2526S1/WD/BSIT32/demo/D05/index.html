<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap demo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  
  <style>
    .glass{
      background-color: rgba(255,255,255,0.7);
      backdrop-filter: blur(40px) brightness(100%);
    }
  </style>
</head>

<body>
  <div class="container-fluid position-sticky top-0 z-1">
    <div class="row">
      <div class="col">
        <div class="card my-4 py-4 px-5 rounded-5 glass">
          <div style="font-family: 'Times New Roman', Times, serif;">
            P<small>OLYTECHNIC</small> U<small>NIVERSITY</small> <small>OF THE</small> P<small>HILIPPINES</small>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <!-- Content -->
  <div class="container">
    <div class="row">
      <div class="col-12">
        <div class="card my-4 p-3 rounded-5 shadow">
          <img src="pup.png" class="rounded-5">
        </div>
      </div>
    </div>

    <div class="row">
      <div class="col-12">
        <div class="card my-4 p-3 rounded-5 shadow">
          <img src="a.jpg" class="rounded-5">
        </div>
      </div>
    </div>
  </div>



  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
