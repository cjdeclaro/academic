<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap demo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  

  <style>
    * {
      transition: 200ms;
    }

    .menu {
      width: 56px;
    }

    .menu:hover {
      width: 100%;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="row">
      <div class="col p-5">
        <div class="card rounded-3 shadow p-5">
          <div class="h5 text-center mb-5">Log in</div>
          <form>
            <div class="row">
              <div class="col-12 col-md-6">
                <div class="my-3">
                  <label for="fname" class="form-label">First Name</label>
                  <input class="form-control" type="text" id="fname" name="fname">
                </div>
              </div>
              <div class="col-12 col-md-6">
                <div class="my-3">
                  <label for="lname" class="form-label">Last Name</label>
                  <input class="form-control" type="text" id="lname" name="lname">
                </div>
              </div>
            </div>
            <div class="row">
              <div class="col-12 col-md-6">
                <div class="my-3">
                  <div class="mb-2">
                    Sex at birth:
                  </div>
                  <div class="form-check">
                    <input id="male" type="radio" name="sex" class="form-check-input">
                    <label class="form-check-label" for="male">Male</label>
                  </div>

                  <div class="form-check">
                    <input id="female" type="radio" name="sex" class="form-check-input">
                    <label class="form-check-label" for="female">Female</label>
                  </div>
                </div>
              </div>
              <div class="col-12 col-md-6">
                <div class="my-3">
                  <div class="mb-2">
                    Year Level:
                  </div>
                  <div class="form-check">
                    <input id="1" type="radio" name="yl" class="form-check-input">
                    <label class="form-check-label" for="1">1st Year</label>
                  </div>

                  <div class="form-check">
                    <input id="2" type="radio" name="yl" class="form-check-input">
                    <label class="form-check-label" for="2">2nd Year</label>
                  </div>

                  <div class="form-check">
                    <input id="3" type="radio" name="yl" class="form-check-input">
                    <label class="form-check-label" for="3">3rd Year</label>
                  </div>

                  <div class="form-check">
                    <input id="4" type="radio" name="yl" class="form-check-input">
                    <label class="form-check-label" for="4">4th Year</label>
                  </div>
                </div>
              </div>
            </div>
            <div class="row">
              <div class="col-12">
                <div class="my-3">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="transfer">
                    <label class="form-check-label" for="transfer">
                      Transferee
                    </label>
                  </div>
                </div>
              </div>
            </div>
            <div class="row">
              <div class="col-12">
                <div class="my-3 text-end">
                  <input type="submit" class="btn btn-success rounded-5 px-5 shadow" value="Submit">
                </div>
              </div>
            </div>
            <div class="row">
              <div class="col-12">
                <div class="p-3 shadow rounded-5 menu text-center">...</div>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
