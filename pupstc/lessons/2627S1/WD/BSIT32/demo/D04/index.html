<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap demo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
  <div class="container p-5">
    <div class="row">
      <div class="col">
        <div class="card rounded-5 shadow p-4 text-center">
          <div class="h1 mb-3">
            Payment
          </div>
          <div class="text-success" id="pay-text">
            Would you like to proceed with the payment?
          </div>
          <div class="my-3">
            <div class="btn btn-success rounded-5 mx-3" onclick="pay()" id="pay-btn">
              Pay Now
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

  <script>
    function pay() {
      var a = document.getElementById("pay-text");
      a.innerHTML = "PAID!";
      a.classList.remove("text-success");
      a.classList.add("text-primary");
      a.classList.add("h3");

      var btn = document.getElementById("pay-btn");
      btn.style.display = "none";
    }
  </script>
</body>

</html>
