<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap demo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
  <div class="container-fluid bg-danger shadow mb-3">
    <div class="row">
      <div class="col">
        <div class="text-center display-6 text-white py-3">Dex</div>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="row">
      <div class="col px-5 my-3">
        <a href="index.html" id="backlink">
          <div class="btn btn-secondary">Back to list</div>
        </a>
      </div>
    </div>
    <div class="row">
      <div class="col px-5">
        <div class="card shadow p-5 text-center rounded-5">
          <div class="mx-auto rounded-circle" style="background-color: grey; width: 300px; height: 300px;"
            id="imgContainer">
            <img id="image" src="" style="width: 300px;" class="mx-auto">
          </div>
          <div class="h3 mt-4 display-5" id="name">
            <div class="spinner-border" role="status">
              <span class="visually-hidden">Loading...</span>
            </div>
          </div>
          <div>
            <span class="badge rounded-pill text-black" id="type"></span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script>
    const colors = {
      fire: '#FDDFDF',
      grass: '#DEFDE0',
      electric: '#FCF7DE',
      water: '#DEF3FD',
      ground: '#f4e7da',
      rock: '#d5d5d4',
      fairy: '#fceaff',
      poison: '#cbc3e3',
      bug: '#f8d5a3',
      dragon: '#97b3e6',
      psychic: '#eaeda1',
      flying: '#F5F5F5',
      fighting: '#E6E0D4',
      normal: '#F5F5F5',
      ghost: '#f8d5a3',
    };

    const queryString = window.location.search;
    const urlParams = new URLSearchParams(queryString);
    const id = urlParams.get('id');
    var page = urlParams.get('page');
    page = page == null ? 1 : page;

    var elName = document.getElementById("name");
    var elImage = document.getElementById("image");
    var elType = document.getElementById("type");
    var elSearch = document.getElementById("searchInput");
    var elImgContainer = document.getElementById("imgContainer");
    var elBacklink = document.getElementById("backlink");

    elBacklink.href = "index.html?page=" + page;

    function capitalizeFirstLetter(str) {
      if (!str) return str;
      return str.charAt(0).toUpperCase() + str.slice(1);
    }

    const getPokemon = async (id) => {
      const response = await fetch('https://pokeapi.co/api/v2/pokemon/' + id);
      const pokemon = await response.json();

      var type = pokemon.types[0].type.name;

      elName.innerHTML = capitalizeFirstLetter(pokemon.name);
      elImage.src = pokemon.sprites.other['official-artwork'].front_default;
      elType.innerHTML = type;
      elImgContainer.style.backgroundColor = colors[type];
      elType.style.backgroundColor = colors[type];
    }

    if(id != null) {
      getPokemon(id);
    }
  </script>
</body>

</html>
