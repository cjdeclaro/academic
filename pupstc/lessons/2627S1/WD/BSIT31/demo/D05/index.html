<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap demo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
  <div class="container">
    <div class="row" id="parent">

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script>
    var people = [
      {
        firstName: "Bill",
        lastName: "Gates",
        age: 28,
        isLoggedIn: true,
        pets: [
          {
            name: "Whitey",
            kind: "cat"
          },
          {
            name: "Browney",
            kind: "fish"
          }
        ]
      },
      {
        firstName: "Ada",
        lastName: "Lovelace",
        age: 29,
        isLoggedIn: true,
        pets: [
          {
            name: "Bantay",
            kind: "dog"
          }
        ]
      },
      {
        firstName: "Steve",
        lastName: "Jobs",
        age: 30,
        isLoggedIn: true,
        pets: []
      }
    ]


    var elParent = document.getElementById("parent");

    for (var i = 0; i < people.length; i++) {
      elParent.innerHTML += `
        <div class="col-12">
          <div class="card p-5 my-3 shadow rounded-4">
            <div class="h2">
              ` + people[i].firstName + " " + people[i].lastName + `
            </div>
            <div class="mt-3">
              Lorem ipsum dolor sit amet consectetur adipisicing elit. Ad voluptatum doloremque deserunt reprehenderit a
              officia placeat culpa voluptatibus sunt, unde modi quos beatae nostrum autem mollitia adipisci iste sequi
              cumque!
            </div>
          </div>
        </div>
      `;
    }
  </script>
</body>

</html>
