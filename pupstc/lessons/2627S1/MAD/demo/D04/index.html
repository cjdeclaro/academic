<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap demo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <style>
    * {
      transition: 0.5s ease;
    }
  </style>
</head>

<body>
  <div class="position-fixed bottom-0 p-4">
    <div class="row">
      <div class="col">
        <div class="card p-3 rounded-5" onmouseenter="show()" onmouseleave="hide()">
          <div class="d-flex flex-row">
            <div id="item0" class="">Options</div>
            <div id="item1" class="d-none">Home</div>
            <div id="item2" class="ms-4 d-none">About</div>
            <div id="item3" class="ms-4 d-none">Contact</div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script>
    var item0 = document.getElementById("item0");
    var item1 = document.getElementById("item1");
    var item2 = document.getElementById("item2");
    var item3 = document.getElementById("item3");
    
    function show(){
      item0.classList.add("d-none");
      item1.classList.remove("d-none");
      item2.classList.remove("d-none");
      item3.classList.remove("d-none");
    }

    function hide(){
      item0.classList.remove("d-none");
      item1.classList.add("d-none");
      item2.classList.add("d-none");
      item3.classList.add("d-none");
    }
  </script>
</body>

</html>
