<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PUP Sto Tomas Campus</title>
  <link rel="icon" href="assets/img/pup.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link href='https://fonts.googleapis.com/css?family=Roboto' rel='stylesheet'>
  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
  <div class="container-fluid position-fixed">
    <div class="row">
      <div class="col p-5" style="background-color: maroon;">
        <div class="d-flex flex align-items-center text-white justify-content-between">
          <div class="d-flex flex-row align-items-center">
          <img src="assets/img/pup.png" style="width: 80px;height: 80px;">
          <div class="ms-3">
            <div class="roboto">Republic of the Philippines</div>
            <div class="times title">
              <span class="bigger">P</span>OLYTECHNIC
              <span class="bigger">U</span>NIVERSITY of the
              <span class="bigger">P</span>HILIPPINES
            </div>
            <div class="times">Sto Tomas Campus</div>
          </div>
          </div>
          <div class="d-flex flex-row times">
            <div class="ms-3">Home</div>
            <div class="ms-3">Academic</div>
            <div class="ms-3">About</div>
            <div class="ms-3">Contact</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="container-fluid p-0">
    <div class="row">
      <div class="col">
        <img class="w-100" src="assets/img/banner.jpg">
      </div>
    </div>
  </div>

  <div class="container-fluid p-3" style="background-color: orange;"></div>

  <div class="container">
    <div class="row">
      <div class="col">
        <div class="text-center times p-5 subtitle">The University</div>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="row">
      <div class="col">
        <img class="w-100" src="assets/img/img.jpg">
      </div>
    </div>
  </div>

  <div class="container-fluid p-5 mt-5" style="background-color: maroon;">
    <div class="row">
      <div class="col p-5">

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
