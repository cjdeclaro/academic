<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>View</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  
  <style>
    a {
      color: unset;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <div class="container-fluid bg-secondary">
    <div class="row">
      <div class="col d-flex flex-row justify-content-between align-items-center">
        <div class="h5 p-3 text-center text-light"><a href="index.html">Back</a></div>
        <div class="h3 p-3 text-center text-light">App</div>
        <div class="h3 p-3 text-center text-light"></div>
      </div>
    </div>
  </div>

  <div class="container mt-4">
    <div class="row">
      <div class="col">
        <div class="card p-4 rounded-4 shadow text-center">
          <div class="h2" id="name"></div>

          <div class="card p-3" style="max-width: 250px;">
            <img src="" id="qrpic">
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const fname = urlParams.get("fname");
    const lname = urlParams.get("lname");

    const qrpic = document.getElementById("qrpic");
    qrpic.src = "https://api.qrserver.com/v1/create-qr-code/?size=500x500&data=https://cjdeclaro.github.io/academic/pupstc/lessons/2526S2/ADET/BSIT31/D02/view.html?fname="+fname+"%26lname="+lname;

    document.getElementById("name").innerHTML = fname + " " + lname;
  </script>
</body>

</html>
