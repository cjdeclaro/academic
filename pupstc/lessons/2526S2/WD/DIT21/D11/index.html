<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap demo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
  <div class="container-fluid bg-danger p-4">
    <div class="row">
      <div class="col">

      </div>
    </div>
  </div>

  <div class="container mt-4">
    <div class="row">
      <div class="col p-5 text-center">
        <div class="h2" id="pokemonName">
          name
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script>
    const pokemonName = document.getElementById("pokemonName");

    const getData = async () => {
      // const response = await fetch('https://pokeapi.co/api/v2/pokemon/15');

      const response = await fetch('https://catfact.ninja/fact');
      const pokemonData = await response.json();

      const name = pokemonData.fact;
      // const pictureURL = pokemonData.sprites.other.home.front_default;

      pokemonName.innerHTML = name;
    }

    getData();
  </script>
</body>

</html>
