<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap demo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body data-bs-theme="light" id="body">
  <div class="container-fluid shadow p-3">
    <div class="row">
      <div class="col text-end">
        <button id="modeBtn" class="btn btn-sm btn-outline-secondary" onclick="switchTheme()">Dark Mode</button>
      </div>
    </div>
  </div>
  <div class="container">
    <div class="row">
      <div class="col">
        <div class="display-3 p-5 text-center" id="bannerText">
          Welcome!
        </div>
      </div>
    </div>
  </div>
  <div class="container">
    <div class="row">
      <div class="col">
        <div class="card shadow rounded-4 p-5">
          <div class="">Tell me about yourself:</div>
          <div class="mt-3">
            <input class="form-control" type="text" id="username">
          </div>
          <div class="mt-3 text-center">
            <button class="btn btn-primary" onclick="sayHello()">Say Hello!</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script>
    const usernameElement = document.getElementById("username");
    const bannerText = document.getElementById("bannerText");

    function sayHello(){
      let username = usernameElement.value;
      if(username == "Admin"){
        bannerText.innerHTML = "Hi " + usernameElement.value;
      } else {
        bannerText.innerHTML = "Hello " + usernameElement.value;
      }
    }

    var mode = "light";
    var body = document.getElementById("body");
    var modeBtn = document.getElementById("modeBtn");

    function switchTheme(){
      if(mode == "light"){
        mode = "dark";
        modeBtn.innerHTML = "Light Mode";
      } else {
        mode = "light";
        modeBtn.innerHTML = "Dark Mode";
      }

      body.setAttribute("data-bs-theme", mode);
    }
  </script>
</body>

</html>
